<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="REMP’ART — studio de création digitale, design graphique, identité visuelle et communication.">
  <meta name="theme-color" content="#ffffff">
  <title>REMP’ART — Studio de création digitale</title>
  <style>
:root{--black:#000000;--red:#ff0000;--blue:#051684;--white:#fff;--ink:#171923;--muted:#626675;--panel:#fff;--line:#e8e9ef;--soft:#f6f7fb;--shadow:0 16px 45px rgba(5,22,132,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:95px}
body{margin:0;background:var(--white);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
.wrap{width:min(1120px,92%);margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);border-bottom:1px solid rgba(232,233,239,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.08em}
.brand img{width:112px;height:54px;object-fit:contain;background:white;border-radius:4px}
.brand span{font-size:.72rem;color:#686b78;display:block;letter-spacing:.14em;font-weight:700;line-height:1.45}
nav{display:flex;gap:25px;align-items:center;font-size:.92rem;font-weight:700}
nav a:not(.btn){transition:color .22s ease}
nav a:not(.btn):hover{color:var(--red)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:13px 19px;border-radius:8px;font-weight:800;border:1px solid transparent;transition:transform .22s ease,box-shadow .22s ease,background .22s ease,border-color .22s ease;cursor:pointer}
.btn-red{background:var(--red);color:white;box-shadow:0 7px 18px rgba(255,0,0,.15)}
.btn-red:hover{background:#df0000;transform:translateY(-2px);box-shadow:0 12px 24px rgba(255,0,0,.2)}
.btn-outline{border-color:#d8dbe5;color:var(--blue);background:white}
.btn-outline:hover{border-color:var(--blue);background:#f5f6ff;transform:translateY(-2px)}
.menu-toggle{display:none;background:#fff;border:1px solid var(--line);color:var(--blue);border-radius:8px;width:44px;height:44px;align-items:center;justify-content:center;font-size:1.35rem;cursor:pointer}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:100px 0 78px;background:radial-gradient(ellipse at 88% 14%,rgba(5,22,132,.08),transparent 35%),radial-gradient(ellipse at 5% 100%,rgba(255,0,0,.045),transparent 32%),#fff}
.hero:after{content:"";position:absolute;z-index:-1;width:310px;height:310px;right:-130px;bottom:-180px;border:1px solid rgba(5,22,132,.14);border-radius:50%;box-shadow:0 0 0 34px rgba(5,22,132,.025),0 0 0 70px rgba(5,22,132,.02)}
.eyebrow{color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:.76rem}
h1{font-size:clamp(2.7rem,7vw,5.8rem);line-height:.99;letter-spacing:-.06em;margin:18px 0 24px;max-width:850px;animation:heroEnter .8s cubic-bezier(.2,.7,.2,1) both}
h1 em{font-style:normal;color:var(--red);display:inline-block;animation:wordEnter .9s .16s both}
.hero .eyebrow{animation:fadeUp .65s .05s both}
.hero p{max-width:620px;color:#5d606d;font-size:1.1rem;margin:0 0 28px;animation:fadeUp .7s .2s both}
.actions{display:flex;gap:12px;flex-wrap:wrap;animation:fadeUp .7s .3s both}
.hero-note{margin-top:46px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:24px;flex-wrap:wrap;color:#666b79;font-size:.88rem}
.hero-note b{color:var(--blue)}
section{padding:78px 0}
.section-head{max-width:700px;margin-bottom:34px}
.section-head h2{font-size:clamp(2rem,4vw,3.1rem);line-height:1.08;margin:10px 0 14px;letter-spacing:-.045em;color:#151722}
.section-head p{color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.service{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:25px;min-height:210px;box-shadow:0 4px 16px rgba(18,25,56,.025);transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease}
.service .num{color:var(--red);font-weight:900;letter-spacing:.12em;font-size:.77rem}
.service h3{font-size:1.2rem;margin:18px 0 8px;color:#171923}
.service p{margin:0;color:var(--muted);font-size:.95rem}
.service:hover{border-color:rgba(5,22,132,.35);transform:translateY(-5px);box-shadow:var(--shadow)}
.blue-section{background:var(--blue);position:relative;overflow:hidden}
.blue-section:before{content:"";position:absolute;width:400px;height:400px;border:1px solid rgba(255,255,255,.1);border-radius:50%;right:-180px;top:-220px;box-shadow:0 0 0 35px rgba(255,255,255,.025),0 0 0 75px rgba(255,255,255,.02)}
.blue-section .section-head h2{color:#fff}
.blue-section .eyebrow{color:#ffb8b8}
.blue-section .section-head p{color:#e1e5ff}
.blue-section .service{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);box-shadow:none}
.blue-section .service h3,.blue-section .service p{color:white}
.blue-section .service p{color:#e1e5ff}
.blue-section .service .num{color:#ffb8b8}
.blue-section .service:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.5)}
.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.portfolio-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 5px 22px rgba(18,25,56,.04);transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}
.portfolio-card:hover{transform:translateY(-6px);box-shadow:0 18px 38px rgba(5,22,132,.12);border-color:#d1d6f2}
.portfolio-art{height:220px;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-weight:900;font-size:1.7rem;line-height:1.05;letter-spacing:-.04em;transition:transform .45s ease,filter .45s ease}
.portfolio-card:hover .portfolio-art{transform:scale(1.035);filter:saturate(1.08)}
.art-red{background:var(--red);color:#fff}
.art-white{background:#f5f5f5;color:#000}
.art-blue{background:var(--blue);color:#fff}
.portfolio-card p{padding:0 18px 18px;color:var(--muted);font-size:.9rem;margin:14px 0 0}
.portfolio-card strong{color:#171923}
.order-layout{display:grid;grid-template-columns:.8fr 1.2fr;gap:35px;align-items:start}
.order-aside{background:var(--blue);padding:30px;border-radius:14px;color:white;box-shadow:var(--shadow);position:sticky;top:105px}
.order-aside h3{font-size:1.6rem;line-height:1.15;margin:10px 0}
.order-aside p{color:#e1e5ff}
form{display:grid;grid-template-columns:1fr
